name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'www/app.html'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Add photo permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Use the fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ImageStudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ImageStudio-APK
          path: ImageStudio.apk
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: Image Studio (latest APK)
          files: ImageStudio.apk
          make_latest: true
