<!DOCTYPE html>
<html lang="en-IN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Image Studio</title>
<style>
html,body{margin:0;height:100%;background:#F4F1FC;font-family:system-ui,sans-serif}
body.dk{background:#1A1730;color:#F1EEFB}
#b{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#b i{width:64px;height:64px;border-radius:28px;background:#E4DEFF;box-shadow:8px 8px 20px rgba(120,108,180,.5),-8px -8px 20px rgba(255,255,255,.9);animation:p 1.1s ease-in-out infinite}
body.dk #b i{background:#2E2650;box-shadow:8px 8px 20px rgba(0,0,0,.55),-8px -8px 20px rgba(255,255,255,.05)}
@keyframes p{0%,100%{transform:scale(.85)}50%{transform:scale(1.05)}}
#b p{margin:0;font-size:14px;opacity:.7;text-align:center;padding:0 24px}
#b button{display:none;min-height:46px;padding:0 24px;border:0;border-radius:999px;background:#573AFC;color:#fff;font-weight:700;font-size:15px}
</style></head><body>
<div id="b"><i></i><p id="m">Loading Image Studio…</p><button id="r">Try again</button></div>
<script>
(function(){
/* Loads the app screen from GitHub so UI changes go live without a new APK.
   Reuse this file in any new project: just change REPO / BRANCH / FILE. */
var REPO='wondermayank-comedy/Photo-apk',BRANCH='main',FILE='www/app.html';
var URL_='https://raw.githubusercontent.com/'+REPO+'/'+BRANCH+'/'+FILE,KEY='ts_app_html';
try{if(localStorage.getItem('theme')==='dark')document.body.className='dk'}catch(e){}
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
function remote(){
  return fetch(URL_+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(t){
    if(t.indexOf('<!--IMAGE-STUDIO-APP-->')<0)throw new Error('bad file');
    try{localStorage.setItem(KEY,t)}catch(e){}
    return t});
}
function bundled(){return fetch('app.html').then(function(r){return r.text()})}
function run(code,parent){var s=document.createElement('script');s.text=code;parent.appendChild(s)}
function mount(html){
  var d=new DOMParser().parseFromString(html,'text/html');
  document.title=d.title||'Image Studio';
  Array.prototype.forEach.call(d.documentElement.attributes,function(a){document.documentElement.setAttribute(a.name,a.value)});
  document.head.innerHTML='';
  var hs=[];
  Array.prototype.forEach.call(d.head.childNodes,function(n){if(n.nodeType!==1)return;if(n.tagName==='SCRIPT')hs.push(n);else document.head.appendChild(document.importNode(n,true))});
  hs.forEach(function(n){if(!n.src)run(n.textContent,document.head)});
  var bs=[];
  Array.prototype.forEach.call(d.body.querySelectorAll('script'),function(n){bs.push(n.textContent);n.parentNode.removeChild(n)});
  document.body.className=d.body.className;
  document.body.innerHTML=d.body.innerHTML;
  bs.forEach(function(c){run(c,document.body)});
}
async function boot(){
  var cached=null;try{cached=localStorage.getItem(KEY)}catch(e){}
  var net=remote().catch(function(){return null});
  var html;
  if(cached){html=(await Promise.race([net,sleep(2500).then(function(){return null})]))||cached}
  else{html=await Promise.race([net,sleep(8000).then(function(){return null})]);if(!html)html=await bundled()}
  mount(html);
}
function go(){boot().catch(function(e){
  document.getElementById('m').textContent='Could not load the app. '+(e&&e.message||'');
  var r=document.getElementById('r');r.style.display='block';r.onclick=function(){r.style.display='none';go()};
})}
go();
})();
</script></body></html>
